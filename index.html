<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN — 2人専用リアルタイム評価共有</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #171717;
      --border: #262626;
      --text: #e5e5e5;
      --text-dim: #737373;
      --gold: #b6a078;
      --gold-glow: rgba(182, 160, 120, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .app-container { width: 100%; max-width: 480px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    
    .my-id-badge { background: #000; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* タブ切り替え */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--text); }
    .badge { background: var(--text); color: #000; font-size: 10px; border-radius: 10px; padding: 2px 6px; margin-left: 4px; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* フォーム */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .score-display-text { font-size: 14px; font-weight: 700; color: #fff; }
    .score-display-text.platinum { color: var(--gold); }

    input[type="text"], select, textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; resize: none; }

    /* 星＋数字 UI */
    .star-scale-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0; }
    .star-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; flex: 1; }
    .star-icon { font-size: 18px; color: #333; transition: color 0.15s; margin-bottom: 4px; }
    .star-item.active .star-icon { color: #fff; }
    .star-item.platinum .star-icon { color: #555; }
    .star-item.platinum.active .star-icon { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
    .star-num { font-size: 10px; font-weight: 700; color: #555; }
    .star-item.active .star-num { color: var(--text-dim); }
    .star-item.platinum.active .star-num { color: var(--gold); }
    
    .divider { width: 1px; height: 28px; background: var(--border); align-self: center; margin: 0; }

    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .submit-btn { flex: 1; background: var(--text); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .share-btn { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }

    /* リスト */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card.is-platinum { border-color: rgba(182, 160, 120, 0.4); }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; word-break: break-all; }
    .card-meta { font-size: 11px; color: var(--text-dim); }
    .card-scores { text-align: right; shrink: 0; white-space: nowrap; }
    .card-score { font-size: 13px; font-weight: 700; color: var(--text); }
    .card-score.platinum { color: var(--gold); }
    .friend-score { font-size: 12px; color: var(--text); margin-top: 2px; font-weight: 600; }
    .friend-score.platinum { color: var(--gold); }
    .card-memo { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
    
    .action-btn { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>

</head>
