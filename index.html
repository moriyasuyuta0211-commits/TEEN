<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN — 2人専用リアルタイム評価共有</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #171717;
      --border: #262626;
      --text: #e5e5e5;
      --text-dim: #737373;
      --gold: #b6a078;
      --gold-glow: rgba(182, 160, 120, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .app-container { width: 100%; max-width: 480px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    
    .my-id-badge { background: #000; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* タブ切り替え */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--text); }
    .badge { background: var(--text); color: #000; font-size: 10px; border-radius: 10px; padding: 2px 6px; margin-left: 4px; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* フォーム */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .score-display-text { font-size: 14px; font-weight: 700; color: #fff; }
    .score-display-text.platinum { color: var(--gold); }

    input[type="text"], select, textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; resize: none; }

    /* 星＋数字 UI */
    .star-scale-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0; }
    .star-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; flex: 1; }
    .star-icon { font-size: 18px; color: #333; transition: color 0.15s; margin-bottom: 4px; }
    .star-item.active .star-icon { color: #fff; }
    .star-item.platinum .star-icon { color: #555; }
    .star-item.platinum.active .star-icon { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
    .star-num { font-size: 10px; font-weight: 700; color: #555; }
    .star-item.active .star-num { color: var(--text-dim); }
    .star-item.platinum.active .star-num { color: var(--gold); }
    
    .divider { width: 1px; height: 28px; background: var(--border); align-self: center; margin: 0; }

    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .submit-btn { flex: 1; background: var(--text); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .share-btn { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }

    /* 検索・並び替えバー */
    .control-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .control-bar input { flex: 1; }
    .control-bar select { width: 130px; flex: none; font-size: 12px; }

    /* 楽曲リンクボタン */
    .music-link-btn { display: inline-flex; align-items: center; gap: 6px; background: #000; border: 1px solid var(--border); color: var(--text); font-size: 11px; padding: 5px 10px; border-radius: 20px; text-decoration: none; margin-top: 6px; transition: background 0.15s; }
    .music-link-btn:hover { background: #222; }

    /* リスト */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card.is-platinum { border-color: rgba(182, 160, 120, 0.4); }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; word-break: break-all; }
    .card-meta { font-size: 11px; color: var(--text-dim); }
    .card-scores { text-align: right; shrink: 0; white-space: nowrap; }
    .card-score { font-size: 13px; font-weight: 700; color: var(--text); }
    .card-score.platinum { color: var(--gold); }
    .friend-score { font-size: 12px; color: var(--text); margin-top: 2px; font-weight: 600; }
    .friend-score.platinum { color: var(--gold); }
    .card-memo { font-size: 11px; color: var(--text-dim); margin-top: 6px; font-style: italic; }
    
    .action-btn { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhc55wV9tg83dAtYL-PkHlaeo3hn9USg8",
      authDomain: "tenn-36f7d.firebaseapp.com",
      projectId: "tenn-36f7d",
      storageBucket: "tenn-36f7d.firebasestorage.app",
      messagingSenderId: "125540409265",
      appId: "1:125540409265:web:e8bfcb2990f6e3814aa790",
      measurementId: "G-S89F1QBE8Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbGet = get;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
    
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TEN</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button onclick="clearAllData()" style="background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; padding: 4px 8px; font-size: 11px; cursor: pointer;">データ消去 🗑️</button>
      <div class="my-id-badge" onclick="copyMyId()">
        <span>ID: <strong id="displayMyId">接続中...</strong></span>
        <span style="font-size: 10px; opacity: 0.7;">📋</span>
      </div>
    </div>
  </header>

  <!-- タブナビゲーション -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('timeline')">タイムライン</button>
    <button class="tab-btn" onclick="switchTab('inbox')">受信トレイ <span class="badge" id="inboxCount" style="display:none;">0</span></button>
    <button class="tab-btn" onclick="switchTab('friends')">設定・フレンド</button>
  </div>

  <!-- 1. タイムライン -->
  <div id="tab-timeline" class="tab-content active">
    <div class="input-card">
      <div class="input-group">
        <label>曲名 / アーティスト名</label>
        <input type="text" id="itemTitle" placeholder="例：曲名 - アーティスト名" style="margin-top: 6px;">
      </div>
      <div class="input-group">
        <label>楽曲URL (Apple Music / Spotify など)</label>
        <input type="text" id="itemUrl" placeholder="https://open.spotify.com/... や music.apple.com/..." style="margin-top: 6px;">
      </div>
      <div class="input-group">
        <div class="label-row">
          <label>評価</label>
          <div class="score-display-text" id="scoreValueDisplay">8 / 10</div>
        </div>
        <div class="star-scale-row" id="starScaleContainer"></div>
      </div>
      <div class="btn-group">
        <button class="submit-btn" onclick="addMyRating()">自分だけで記録</button>
        <button class="share-btn" onclick="openSendTopicModal()">フレンドにお題を送信</button>
      </div>
    </div>

    <!-- 検索バー ＆ 並び替えドロップダウン -->
    <div class="control-bar">
      <input type="text" id="searchInput" placeholder="曲名や歌手名で検索..." oninput="renderList()">
      <select id="sortSelect" onchange="renderList()">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
        <option value="highest">スコアが高い順</option>
      </select>
    </div>

    <div id="ratingList"></div>
  </div>

  <!-- 2. 受信トレイ -->
  <div id="tab-inbox" class="tab-content">
    <div id="inboxList">
      <p style="text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px;">届いたお題はありません</p>
    </div>
  </div>

  <!-- 3. 設定・フレンド -->
  <div id="tab-friends" class="tab-content">
    <div class="input-card">
      <div class="input-group">
        <label>自分の表示名</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="myNameInput" placeholder="例: たろう">
          <button class="submit-btn" style="width: 80px; flex: none; padding: 0 12px;" onclick="saveMyName()">保存</button>
        </div>
      </div>
    </div>

    <div class="input-card">
      <div class="input-group">
        <label>友達のIDを登録</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="friendIdInput" placeholder="例: TEN-A8F2">
          <button class="submit-btn" style="width: 80px; flex: none; padding: 0 12px;" onclick="addFriend()">登録</button>
        </div>
      </div>
    </div>
    <div id="friendsList"></div>
  </div>
</div>

<!-- お題送信モーダル -->
<div class="modal-overlay" id="sendModal">
  <div class="modal-content" style="text-align: left;">
    <div class="modal-title" style="text-align: center;">曲をお題として送信</div>
    
    <div class="input-group">
      <label>送信先フレンド</label>
      <select id="friendSelect" style="margin-top: 6px;"></select>
    </div>

    <div class="input-group">
      <label>曲名 / アーティスト名</label>
      <input type="text" id="sendTopicTitleInput" placeholder="例：曲名 - アーティスト名" style="margin-top: 6px;">
    </div>

    <div class="input-group">
      <label>楽曲URL (Apple Music / Spotify)</label>
      <input type="text" id="sendTopicUrlInput" placeholder="URLをペースト..." style="margin-top: 6px;">
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="submit-btn" onclick="sendTopicToFriend()" style="width: 100%; margin-bottom: 8px;">送信する</button>
      <button class="action-btn" onclick="closeModal('sendModal')">キャンセル</button>
    </div>
  </div>
</div>

<!-- 評価返信モーダル -->
<div class="modal-overlay" id="evalModal">
  <div class="modal-content" style="text-align: left;">
    <div class="modal-title" style="text-align: center;" id="modalTopicTitle">お題の評価</div>
    <div id="modalMusicLinkContainer" style="text-align: center; margin-bottom: 12px;"></div>
    
    <div class="label-row" style="margin-bottom: 8px;">
      <label>評価</label>
      <div class="score-display-text" id="modalScoreValueDisplay">8 / 10</div>
    </div>
    <div class="star-scale-row" id="modalStarScaleContainer" style="margin-bottom:16px;"></div>

    <div class="input-group">
      <label>メモ（感想など）</label>
      <textarea id="evalMemoInput" rows="2" placeholder="曲の感想を入力..." style="margin-top: 6px;"></textarea>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="submit-btn" onclick="submitEvaluationResponse()" style="width: 100%; margin-bottom: 8px;">評価を確定して返信</button>
      <button class="action-btn" onclick="closeModal('evalModal')">キャンセル</button>
    </div>
  </div>
</div>

<script>
  let myId = '';
  let myName = '';
  let selectedScore = 8;
  let modalScore = 8;
  let currentInboxItem = null;

  window.addEventListener('firebase-ready', () => {
    initMyProfile();
    renderMainScale();
    renderList();
    renderFriends();
    setupRealtimeListeners();
  });

  function initMyProfile() {
    let storedId = localStorage.getItem('ten_my_id');
    if (!storedId) {
      const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
      storedId = 'TEN-' + randomStr;
      localStorage.setItem('ten_my_id', storedId);
    }
    myId = storedId;
    document.getElementById('displayMyId').innerText = myId;

    myName = localStorage.getItem('ten_my_name') || myId;
    document.getElementById('myNameInput').value = localStorage.getItem('ten_my_name') || '';

    syncProfileToFirebase();
  }

  function syncProfileToFirebase() {
    if (!myId) return
