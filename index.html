<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN — 評価して、残す。</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #171717;
      --border: #262626;
      --text: #e5e5e5;
      --text-dim: #737373;
      --gold: #b6a078;
      --gold-glow: rgba(182, 160, 120, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .app-container { width: 100%; max-width: 480px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .badge-count { font-size: 12px; color: var(--text-dim); }

    /* 受信エリア */
    .receive-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 20px; display: flex; gap: 8px; }
    .receive-box input { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 8px 12px; font-size: 12px; }
    .receive-box button { background: var(--border); color: var(--text); border: none; border-radius: 4px; padding: 8px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }

    /* フォーム */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; }

    /* 星評価バー */
    .star-scale { display: flex; align-items: center; justify-content: space-between; background: #000; padding: 10px; border-radius: 6px; border: 1px solid var(--border); }
    .star-btn { background: none; border: none; color: #404040; font-size: 16px; cursor: pointer; transition: color 0.15s; }
    .star-btn.active { color: var(--text); }
    .star-btn.platinum.active { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
    .divider { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }

    .submit-btn { width: 100%; background: var(--text); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 12px; font-size: 14px; cursor: pointer; margin-top: 12px; }

    /* リスト */
    .controls { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-input { flex: 1; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-dim); padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .filter-btn.active { color: var(--gold); border-color: var(--gold); }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card.is-platinum { border-color: rgba(182, 160, 120, 0.4); }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .card-meta { font-size: 10px; color: var(--text-dim); }
    .card-score { font-size: 14px; font-weight: 700; color: var(--text); }
    .card-score.platinum { color: var(--gold); }
    
    .card-actions { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .action-btn { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TEN</h1>
    <span class="badge-count" id="totalCount">0 記録</span>
  </header>

  <!-- 友達からの評価受信用 -->
  <div class="receive-box">
    <input type="text" id="receiveInput" placeholder="友達からのシェアコードを貼り付け">
    <button onclick="receiveSharedItem()">受け取る</button>
  </div>

  <!-- 入力フォーム -->
  <div class="input-card">
    <div class="input-group">
      <label>評価対象</label>
      <input type="text" id="itemTitle" placeholder="映画名、レストラン、本など">
    </div>
    <div class="input-group">
      <label>評価 (1 — 11)</label>
      <div class="star-scale" id="starContainer"></div>
    </div>
    <button class="submit-btn" onclick="addRating()">記録する</button>
  </div>

  <!-- 一覧コントロール -->
  <div class="controls">
    <input type="text" class="search-input" id="searchInput" placeholder="検索..." oninput="renderList()">
    <button class="filter-btn" id="platinumFilter" onclick="togglePlatinumFilter()">11/10のみ</button>
  </div>

  <!-- 評価一覧 -->
  <div id="ratingList"></div>
</div>

<script>
  let selectedScore = 10;
  let showPlatinumOnly = false;

  // 初期化
  document.addEventListener('DOMContentLoaded', () => {
    initStars();
    renderList();
  });

  // 星（1〜11）の表示
  function initStars() {
    const container = document.getElementById('starContainer');
    container.innerHTML = '';
    for (let i = 1; i <= 11; i++) {
      if (i === 11) {
        const div = document.createElement('div');
        div.className = 'divider';
        container.appendChild(div);
      }
      const btn = document.createElement('button');
      btn.className = `star-btn ${i === 11 ? 'platinum' : ''} ${i <= selectedScore ? 'active' : ''}`;
      btn.innerText = '★';
      btn.onclick = () => { selectedScore = i; initStars(); };
      container.appendChild(btn);
    }
  }

  // データ保存・読み込み
  function getRatings() { return JSON.parse(localStorage.getItem('ten_ratings') || '[]'); }
  function saveRatings(data) { localStorage.setItem('ten_ratings', JSON.stringify(data)); }

  // 記録追加
  function addRating() {
    const titleInput = document.getElementById('itemTitle');
    const title = titleInput.value.trim();
    if (!title) return alert('対象名を入力してください');

    const ratings = getRatings();
    ratings.unshift({
      id: Date.now(),
      title: title,
      score: selectedScore,
      date: new Date().toISOString().split('T')[0],
      isFriend: false
    });

    saveRatings(ratings);
    titleInput.value = '';
    renderList();
  }

  // アイテムを個別シェア（コード発行）
  function shareItem(id) {
    const ratings = getRatings();
    const item = ratings.find(r => r.id === id);
    if (!item) return;

    // シェア用オブジェクトを作成
    const shareData = {
      title: item.title,
      score: item.score,
      from: '友達'
    };

    const code = btoa(encodeURIComponent(JSON.stringify(shareData)));
    navigator.clipboard.writeText(code).then(() => {
      alert(`「${item.title}」の評価コードをコピーしました！LINE等で友達に送ってください。`);
    });
  }

  // 友達からのシェアコードを受け取る
  function receiveSharedItem() {
    const input = document.getElementById('receiveInput');
    const code = input.value.trim();
    if (!code) return;

    try {
      const decoded = JSON.parse(decodeURIComponent(atob(code)));
      if (!decoded.title || !decoded.score) throw new Error();

      const ratings = getRatings();
      ratings.unshift({
        id: Date.now(),
        title: `${decoded.title} (${decoded.from}の評価: ${decoded.score}/10)`,
        score: decoded.score,
        date: new Date().toISOString().split('T')[0],
        isFriend: true
      });

      saveRatings(ratings);
      input.value = '';
      alert(`「${decoded.title}」の評価を受け取りました！`);
      renderList();
    } catch (e) {
      alert('無効なコードです。正しいコードを入力してください。');
    }
  }

  // 削除
  function deleteRating(id) {
    let ratings = getRatings().filter(r => r.id !== id);
    saveRatings(ratings);
    renderList();
  }

  // フィルター切り替え
  function togglePlatinumFilter() {
    showPlatinumOnly = !showPlatinumOnly;
    document.getElementById('platinumFilter').classList.toggle('active', showPlatinumOnly);
    renderList();
  }

  // リスト描画
  function renderList() {
    const listEl = document.getElementById('ratingList');
    const search = document.getElementById('searchInput').value.toLowerCase();
    let ratings = getRatings();

    document.getElementById('totalCount').innerText = `${ratings.length} 記録`;

    if (showPlatinumOnly) ratings = ratings.filter(r => r.score === 11);
    if (search) ratings = ratings.filter(r => r.title.toLowerCase().includes(search));

    listEl.innerHTML = ratings.map(r => `
      <div class="card ${r.score === 11 ? 'is-platinum' : ''}">
        <div>
          <div class="card-title">${r.title}</div>
          <div class="card-meta">${r.date} ${r.isFriend ? '• 友達から' : ''}</div>
          <div class="card-actions">
            ${!r.isFriend ? `<button class="action-btn" onclick="shareItem(${r.id})">友達に送る</button>` : ''}
            <button class="action-btn" onclick="deleteRating(${r.id})">削除</button>
          </div>
        </div>
        <div class="card-score ${r.score === 11 ? 'platinum' : ''}">
          ${r.score === 11 ? '★ 11/10' : `${r.score} / 10`}
        </div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
