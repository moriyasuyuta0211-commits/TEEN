<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEN — 評価して、残す。</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #e5e5e5;
            padding: 20px 16px 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #262626;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #888888;
            font-weight: normal;
            margin-left: 6px;
        }

        .count-badge {
            font-size: 13px;
            color: #888888;
        }

        .form-card {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #a3a3a3;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0d0d0d;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ffffff;
        }

        .star-rating-container {
            background-color: #0d0d0d;
            border: 1px solid #333333;
            border-radius: 10px;
            padding: 12px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .star-rating {
            display: flex;
            width: 100%;
            justify-content: space-around;
        }

        .star {
            font-size: 26px;
            cursor: pointer;
            color: #444444;
            user-select: none;
            line-height: 1;
            transition: color 0.15s, transform 0.1s;
        }

        .star.active {
            color: #ffffff;
        }

        .star:active {
            transform: scale(1.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
        }

        select {
            padding: 12px 14px;
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-main {
            flex: 1;
            padding-right: 12px;
            overflow: hidden;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .item-date {
            font-size: 12px;
            color: #666666;
        }

        .item-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .score-badge {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #555555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>TEN<span class="subtitle">— 評価して、残す。</span></h1>
        </div>
        <div class="count-badge" id="totalCount">0 記録</div>
    </header>

    <div class="form-card">
        <div class="input-group">
            <label for="titleInput">対象名</label>
            <input type="text" id="titleInput" placeholder="例：雨の日の散歩、ある映画など">
        </div>

        <div class="input-group">
            <label>評価</label>
            <div class="star-rating-container">
                <div class="star-rating" id="starRating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                    <span class="star" data-value="6">★</span>
                    <span class="star" data-value="7">★</span>
                    <span class="star" data-value="8">★</span>
                    <span class="star" data-value="9">★</span>
                    <span class="star" data-value="10">★</span>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="saveBtn">記録する</button>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="対象名で検索...">
        <select id="sortSelect">
            <option value="desc">新しい順</option>
            <option value="asc">古い順</option>
            <option value="score-desc">評価が高い順</option>
            <option value="score-asc">評価が低い順</option>
        </select>
    </div>

    <div class="list-container" id="recordList"></div>

    <script>
        let currentScore = 10;
        let records = JSON.parse(localStorage.getItem('ten_app_records') || '[]');

        const starRating = document.getElementById('starRating');
        const stars = starRating.querySelectorAll('.star');
        const titleInput = document.getElementById('titleInput');
        const saveBtn = document.getElementById('saveBtn');
        const recordList = document.getElementById('recordList');
        const totalCount = document.getElementById('totalCount');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        function updateStars(val) {
            currentScore = val;
            stars.forEach(star => {
                const starVal = parseInt(star.getAttribute('data-value'));
                if (starVal <= val) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        updateStars(10);

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const val = parseInt(star.getAttribute('data-value'));
                updateStars(val);
            });
        });

        saveBtn.addEventListener('click', () => {
            const title = titleInput.value.trim();
            if (!title) {
                alert('対象名を入力してください');
                return;
            }

            const newRecord = {
                id: Date.now(),
                title: title,
                score: currentScore,
                date: new Date().toISOString().split('T')[0]
            };

            records.unshift(newRecord);
            saveRecords();
            titleInput.value = '';
            updateStars(10);
            renderRecords();
        });

        function saveRecords() {
            localStorage.setItem('ten_app_records', JSON.stringify(records));
        }

        function deleteRecord(id) {
            if (confirm('この記録を削除しますか？')) {
                records = records.filter(r => r.id !== id);
                saveRecords();
                renderRecords();
            }
        }

            let filtered = records.filter(r => 
                r.title.toLowerCase().includes(searchInput.value.toLowerCase())
            );

                filtered.sort((a, b) => b.id - a.id);
            } else if (sortVal === 'asc') {
                filtered.sort((a, b) => a.id - b.id);
