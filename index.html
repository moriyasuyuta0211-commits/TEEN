<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEN — 評価して、残す。</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlRFTiIsCiAgInNob3J0X25hbWUiOiAiVEVOIiwKICAic3RhcnRfdXJsIjogIi4vIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMTAxMDEwIiwKICAidGhlbWVfY29sb3IiOiAiIzEwMTAxMCIKfQ==">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d0d;
            color: #e5e5e5;
            padding: 20px 16px 40px;
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #262626;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #888888;
            font-weight: normal;
            margin-left: 6px;
        }

        .count-badge {
            font-size: 13px;
            color: #888888;
        }

        .form-card {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group:last-of-type {
            margin-bottom: 16px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #a3a3a3;
            font-weight: 500;
        }

        .score-display {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0d0d0d;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ffffff;
        }

        .star-rating-container {
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .star-rating {
            display: flex;
            width: 100%;
            justify-content: space-between;
            gap: 2px;
        }

        .star-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            flex: 1;
            padding: 4px 0;
        }

        .star {
            font-size: 21px;
            color: #333333;
            user-select: none;
            line-height: 1;
            transition: color 0.15s, transform 0.1s;
        }

        .star-wrapper.active .star {
            color: #ffffff;
        }

        .star-num {
            font-size: 10px;
            color: #666666;
            margin-top: 6px;
            font-weight: 600;
            user-select: none;
        }

        .star-wrapper.active .star-num {
            color: #ffffff;
        }

        /* 11番目（プラチナ）の特別星スタイル */
        .star-wrapper.platinum .star-box {
            border: 1px dashed #737373;
            border-radius: 6px;
            padding: 3px 4px;
            background: #1f1f23;
        }

        .star-wrapper.platinum.active .star-box {
            border-color: #ffffff;
            background: #333338;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .star-wrapper.platinum .star {
            color: #777777;
        }

        .star-wrapper.platinum.active .star {
            color: #f1f5f9;
            text-shadow: 0 0 6px rgba(241, 245, 249, 0.6);
        }

        .star-wrapper:active .star {
            transform: scale(1.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 4px;
        }

        .btn-submit:active {
            opacity: 0.8;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        .search-input {
            flex: 1;
        }

        select {
            padding: 12px 14px;
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 10px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: #171717;
            border: 1px solid #262626;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .item-card.is-platinum {
            background: linear-gradient(135deg, #1c1c1e, #141416);
            border: 1px solid #8e8e93;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .item-main {
            flex: 1;
            padding-right: 12px;
            overflow: hidden;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            word-break: break-all;
        }

        .item-date {
            font-size: 12px;
            color: #666666;
        }

        .item-side {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .score-badge {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .score-badge.platinum-badge {
            color: #f1f5f9;
            text-shadow: 0 0 6px rgba(241, 245, 249, 0.4);
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 12px;
            cursor: pointer;
            padding: 2px 4px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #555555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>TEN<span class="subtitle">— 評価して、残す。</span></h1>
        </div>
        <div class="count-badge" id="totalCount">0 記録</div>
    </header>

    <div class="form-card">
        <div class="input-group">
            <label for="titleInput">評価対象</label>
            <input type="text" id="titleInput" placeholder="例：ある曲、映画など">
        </div>

        <div class="input-group">
            <div class="label-row">
                <label>評価</label>
                <span class="score-display" id="scoreDisplay">10 / 10</span>
            </div>
            <div class="star-rating-container">
                <div class="star-rating" id="starRating">
                    <div class="star-wrapper" data-value="1"><span class="star">★</span><span class="star-num">1</span></div>
                    <div class="star-wrapper" data-value="2"><span class="star">★</span><span class="star-num">2</span></div>
                    <div class="star-wrapper" data-value="3"><span class="star">★</span><span class="star-num">3</span></div>
                    <div class="star-wrapper" data-value="4"><span class="star">★</span><span class="star-num">4</span></div>
                    <div class="star-wrapper" data-value="5"><span class="star">★</span><span class="star-num">5</span></div>
                    <div class="star-wrapper" data-value="6"><span class="star">★</span><span class="star-num">6</span></div>
                    <div class="star-wrapper" data-value="7"><span class="star">★</span><span class="star-num">7</span></div>
                    <div class="star-wrapper" data-value="8"><span class="star">★</span><span class="star-num">8</span></div>
                    <div class="star-wrapper" data-value="9"><span class="star">★</span><span class="star-num">9</span></div>
                    <div class="star-wrapper" data-value="10"><span class="star">★</span><span class="star-num">10</span></div>
                    <!-- 11番目：プラチナ星 -->
                    <div class="star-wrapper platinum" data-value="11">
                        <div class="star-box"><span class="star">★</span></div>
                        <span class="star-num">11</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn-submit" id="saveBtn">記録する</button>
    </div>

    <div class="filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="対象名で検索...">
        <select id="sortSelect">
            <option value="desc">新しい順</option>
            <option value="asc">古い順</option>
            <option value="score-desc">評価が高い順</option>
            <option value="score-asc">評価が低い順</option>
        </select>
    </div>

    <div class="list-container" id="recordList"></div>

    <script>
        let currentScore = 10;
        let records = JSON.parse(localStorage.getItem('ten_app_records') || '[]');

        const starRating = document.getElementById('starRating');
        const starWrappers = starRating.querySelectorAll('.star-wrapper');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const titleInput = document.getElementById('titleInput');
        const saveBtn = document.getElementById('saveBtn');
        const recordList = document.getElementById('recordList');
        const totalCount = document.getElementById('totalCount');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        // 触覚フィードバック（バイブレーション）関数
        function triggerHaptic() {
            if (navigator.vibrate) {
                // 15ミリ秒の軽い振動
                navigator.vibrate(15);
            }
        }

        function updateStars(val) {
            currentScore = val;
            if (val === 11) {
                scoreDisplay.textContent = '11 / 10';
            } else {
                scoreDisplay.textContent = `${val} / 10`;
            }

            starWrappers.forEach(wrapper => {
                const starVal = parseInt(wrapper.getAttribute('data-value'));
                if (val === 11) {
                    if (starVal === 11) {
                        wrapper.classList.add('active');
                    } else {
                        wrapper.classList.remove('active');
                    }
                } else {
                    if (starVal <= val && starVal !== 11) {
                        wrapper.classList.add('active');
                    } else {
                        wrapper.classList.remove('active');
                    }
                }
            });
        }

        updateStars(10);

        starWrappers.forEach(wrapper => {
            wrapper.addEventListener('click', () => {
                const val = parseInt(wrapper.getAttribute('data-value'));
                triggerHaptic(); // タップ時に触覚フィードバックを発生
                updateStars(val);
            });
        });

        saveBtn.addEventListener('click', () => {
            const title = titleInput.value.trim();
            if (!title) {
                alert('対象名を入力してください');
                return;
            }

            triggerHaptic(); // 記録時にも軽く振動

            const newRecord = {
                id: Date.now(),
                title: title,
                score: currentScore,
                date: new Date().toISOString().split('T')[0]
            };

            records.unshift(newRecord);
            saveRecords();
            titleInput.value = '';
            updateStars(10);
            renderRecords();
        });

        function saveRecords() {
            localStorage.setItem('ten_app_records', JSON.stringify(records));
        }

        function deleteRecord(id) {
            if (confirm('この記録を削除しますか？')) {
                triggerHaptic();
                records = records.filter(r => r.id !== id);
                saveRecords();
                renderRecords();
            }
        }

        function renderRecords() {
            let filtered = records.filter(r => 
                r.title.toLowerCase().includes(searchInput.value.toLowerCase())
            );

            const sortVal = sortSelect.value;
            if (sortVal === 'desc') {
                filtered.sort((a, b) => b.id - a.id);
            } else if (sortVal === 'asc') {
                filtered.sort((a, b) => a.id - b.id);
            } else if (sortVal === 'score-desc') {
                filtered.sort((a, b) => b.score - a.score);
            } else if (sortVal === 'score-asc') {
                filtered.sort((a, b) => a.score - b.score);
            }

            totalCount.textContent = `${records.length} 記録`;

            if (filtered.length === 0) {
                recordList.innerHTML = '<div class="empty-state">記録はありません</div>';
                return;
            }

            recordList.innerHTML = filtered.map(r => {
                const isPlatinum = r.score === 11;
                const scoreText = isPlatinum ? '★ 11/10' : `★ ${r.score}/10`;
                const cardClass = isPlatinum ? 'item-card is-platinum' : 'item-card';
                const badgeClass = isPlatinum ? 'score-badge platinum-badge' : 'score-badge';

                return `
                    <div class="${cardClass}">
                        <div class="item-main">
                            <div class="item-title">${escapeHtml(r.title)}</div>
                            <div class="item-date">${r.date}</div>
                        </div>
                        <div class="item-side">
                            <div class="${badgeClass}">${scoreText}</div>
                            <button class="btn-delete" onclick="deleteRecord(${r.id})">削除</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        searchInput.addEventListener('input', renderRecords);
        sortSelect.addEventListener('change', renderRecords);

        renderRecords();
    </script>
</body>
</html>
