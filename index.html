<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN</title>
  
  <!-- アプリアイコンの設定 -->
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <!-- 紙吹雪ライブラリ (canvas-confetti) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #171717;
      --border: #262626;
      --text: #e5e5e5;
      --text-dim: #737373;
      --gold: #b6a078;
      --gold-glow: rgba(182, 160, 120, 0.25);
      --admin-gold: #f59e0b;
      --admin-glow: rgba(245, 158, 11, 0.3);
      --god-gold: #fbbf24;
      --god-glow: rgba(251, 191, 36, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .app-container { width: 100%; max-width: 480px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    
    .my-id-badge { background: #000; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .my-id-badge.admin { border-color: var(--admin-gold); box-shadow: 0 0 8px var(--admin-glow); }

    /* メインタブ切り替え */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--text); }
    .badge { background: #ef4444; color: #fff; font-size: 10px; border-radius: 10px; padding: 2px 6px; margin-left: 4px; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ホーム内サブタブ */
    .sub-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; }
    .sub-tab-btn { background: #000; border: 1px solid var(--border); color: var(--text-dim); padding: 8px 4px; font-size: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; text-align: center; white-space: nowrap; }
    .sub-tab-btn.active { background: var(--text); color: #000; border-color: var(--text); }

    /* フォーム */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .input-group { margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .score-display-text { font-size: 14px; font-weight: 700; color: #fff; }
    .score-display-text.platinum { color: var(--gold); }
    .score-display-text.admin-max { color: var(--admin-gold); }
    .score-display-text.god-max { color: var(--god-gold); text-shadow: 0 0 10px var(--god-glow); }

    input[type="text"], select, textarea { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; resize: none; }

    /* 星＋数字 UI（横スクロール対応） */
    .star-scale-wrapper { overflow-x: auto; padding-bottom: 4px; }
    .star-scale-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0; min-width: max-content; gap: 2px; }
    .star-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; padding: 0 3px; }
    .star-icon { font-size: 15px; color: #333; transition: color 0.15s; margin-bottom: 4px; }
    .star-item.active .star-icon { color: #fff; }
    .star-item.platinum .star-icon { color: #555; }
    .star-item.platinum.active .star-icon { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
    .star-item.admin-star.active .star-icon { color: var(--admin-gold); text-shadow: 0 0 8px var(--admin-glow); }
    .star-item.god-star.active .star-icon { color: var(--god-gold); text-shadow: 0 0 12px var(--god-glow); }
    .star-num { font-size: 9px; font-weight: 700; color: #555; }
    .star-item.active .star-num { color: var(--text-dim); }
    .star-item.platinum.active .star-num { color: var(--gold); }
    .star-item.admin-star.active .star-num { color: var(--admin-gold); }
    .star-item.god-star.active .star-num { color: var(--god-gold); }
    
    .divider { width: 1px; height: 28px; background: var(--border); align-self: center; margin: 0 3px; }

    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .submit-btn { flex: 1; background: var(--text); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .share-btn { flex: 1; background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 600; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .reject-btn { background: transparent; color: #ff5555; border: 1px solid #442222; font-weight: 600; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; white-space: nowrap; }

    /* 検索・並び替えバー */
    .control-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .control-bar input { flex: 1; }
    .control-bar select { width: 120px; flex: none; font-size: 12px; }

    /* 楽曲リンクボタン */
    .music-link-btn { display: inline-flex; align-items: center; gap: 6px; background: #000; border: 1px solid var(--border); color: var(--text); font-size: 11px; padding: 5px 10px; border-radius: 20px; text-decoration: none; margin-top: 4px; transition: background 0.15s; }
    .music-link-btn:hover { background: #222; }

    /* リスト */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card.is-platinum { border-color: rgba(182, 160, 120, 0.4); }
    .card.is-admin-card { border-color: rgba(245, 158, 11, 0.4); }
    .card.is-god-card { border-color: rgba(251, 191, 36, 0.8); box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; word-break: break-all; }
    .card-meta { font-size: 11px; color: var(--text-dim); }
    .card-scores { text-align: right; shrink: 0; white-space: nowrap; }
    .card-score { font-size: 13px; font-weight: 700; color: var(--text); }
    .card-score.platinum { color: var(--gold); }
    .card-score.admin-score { color: var(--admin-gold); }
    .card-score.god-score { color: var(--god-gold); text-shadow: 0 0 8px var(--god-glow); }
    .friend-score { font-size: 12px; color: var(--text); margin-top: 2px; font-weight: 600; }
    .friend-score.platinum { color: var(--gold); }
    .friend-score.admin-score { color: var(--admin-gold); }
    .friend-score.god-score { color: var(--god-gold); text-shadow: 0 0 8px var(--god-glow); }
    .card-memo { font-size: 11px; color: var(--text-dim); margin-top: 6px; font-style: italic; }
    
    .action-btn { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }
    
    /* 運営バッジ・称号バッジ */
    .admin-badge { background: rgba(245, 158, 11, 0.15); color: var(--admin-gold); border: 1px solid var(--admin-gold); font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: bold; margin-left: 4px; }
    .title-badge { background: rgba(255, 255, 255, 0.1); color: #e5e5e5; border: 1px solid #555; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhc55wV9tg83dAtYL-PkHlaeo3hn9USg8",
      authDomain: "tenn-36f7d.firebaseapp.com",
      projectId: "tenn-36f7d",
      storageBucket: "tenn-36f7d.firebasestorage.app",
      messagingSenderId: "125540409265",
      appId: "1:125540409265:web:e8bfcb2990f6e3814aa790",
      measurementId: "G-S89F1QBE8Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbGet = get;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
    
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TEN</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button onclick="clearAllData()" style="background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; padding: 4px 8px; font-size: 11px; cursor: pointer;">データ消去 🗑️</button>
      <div class="my-id-badge" id="myIdBadgeElement" onclick="copyMyId()">
        <span>ID: <strong id="displayMyId">接続中...</strong></span>
        <span style="font-size: 10px; opacity: 0.7;">📋</span>
      </div>
    </div>
  </header>

  <!-- タブナビゲーション -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('timeline')">ホーム</button>
    <button class="tab-btn" onclick="switchTab('inbox')">受信トレイ <span class="badge" id="inboxCount" style="display:none;">0</span></button>
    <button class="tab-btn" onclick="switchTab('friends')">設定・フレンド</button>
  </div>

  <!-- 1. タイムライン -->
  <div id="tab-timeline" class="tab-content active">
    <div class="input-card">
      <div class="input-group">
        <label>曲名 / アーティスト名 (任意)</label>
        <input type="text" id="itemTitle" placeholder="例：曲名 - アーティスト名" style="margin-top: 6px;">
      </div>
      <div class="input-group">
        <label>楽曲URL (任意)</label>
        <input type="text" id="itemUrl" placeholder="https://open.spotify.com/... や music.apple.com/..." style="margin-top: 6px;">
      </div>
      <div class="input-group">
        <div class="label-row">
          <label>評価</label>
          <div class="score-display-text" id="scoreValueDisplay">8 / 10</div>
        </div>
        <div class="star-scale-wrapper">
          <div class="star-scale-row" id="starScaleContainer"></div>
        </div>
      </div>
      <div class="btn-group">
        <button class="submit-btn" onclick="addMyRating()">自分だけで記録</button>
        <button class="share-btn" onclick="openSendTopicModal()">フレンドにお題を送信</button>
      </div>
    </div>

    <!-- ホーム内サブタブ -->
    <div class="sub-tabs">
      <button class="sub-tab-btn active" onclick="setTimelineFilter('all', this)">すべて</button>
      <button class="sub-tab-btn" onclick="setTimelineFilter('complete', this)">完了済み</button>
      <button class="sub-tab-btn" onclick="setTimelineFilter('waiting', this)">⏳ 評価待ち</button>
      <button class="sub-tab-btn" onclick="setTimelineFilter('rejected', this)">❌ 拒否</button>
    </div>

    <!-- 検索バー ＆ 並び替えバー -->
    <div class="control-bar">
      <input type="text" id="searchInput" placeholder="曲名や歌手名で検索..." oninput="renderList()">
      <select id="sortSelect" onchange="renderList()">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
        <option value="highest">スコアが高い順</option>
      </select>
    </div>

    <div id="ratingList"></div>
  </div>

  <!-- 2. 受信トレイ -->
  <div id="tab-inbox" class="tab-content">
    <div id="friendRequestsInboxList"></div>
    <div id="inboxList">
      <p style="text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px;">届いたお題はありません</p>
    </div>
  </div>

  <!-- 3. 設定・フレンド -->
  <div id="tab-friends" class="tab-content">
    <div class="input-card">
      <div class="input-group">
        <label>自分の表示名</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="myNameInput" placeholder="例: たろう">
          <button class="submit-btn" style="width: 80px; flex: none; padding: 0 12px;" onclick="saveMyName()">保存</button>
        </div>
      </div>
    </div>

    <div class="input-card">
      <div class="input-group">
        <label>友達にフレンド申請を送る</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="friendIdInput" placeholder="例: TEN-A8F2">
          <button class="submit-btn" style="width: 100px; flex: none; padding: 0 12px;" onclick="sendFriendRequest()">申請を送信</button>
        </div>
      </div>
    </div>

    <div id="friendRequestsSection" style="margin-bottom: 20px; display: none;">
      <label style="display: block; margin-bottom: 8px; color: var(--gold); font-weight: bold; font-size: 12px;">👥 届いているフレンド申請</label>
      <div id="friendRequestsList"></div>
    </div>

    <div id="friendsList"></div>

    <!-- 運営専用：全ユーザー管理リスト -->
    <div id="adminAllUsersSection" style="display: none; margin-top: 24px;">
      <label style="display: block; margin-bottom: 8px; color: var(--admin-gold); font-weight: bold;">👑 運営専用：全登録ユーザー管理（称号付与・申請・追放）</label>
      <div id="adminAllUsersList"></div>
    </div>
  </div>
</div>

<!-- お題送信モーダル -->
<div class="modal-overlay" id="sendModal">
  <div class="modal-content" style="text-align: left;">
    <div class="modal-title" style="text-align: center;">曲をお題として送信</div>
    
    <div class="input-group">
      <label>送信先フレンド</label>
      <select id="friendSelect" style="margin-top: 6px;"></select>
    </div>

    <div class="input-group">
      <label>楽曲URL (任意)</label>
      <input type="text" id="sendTopicUrlInput" placeholder="URLをペースト..." style="margin-top: 6px;">
    </div>

    <div class="input-group">
      <label>曲名 / アーティスト名 (任意)</label>
      <input type="text" id="sendTopicTitleInput" placeholder="例：曲名 - アーティスト名" style="margin-top: 6px;">
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="submit-btn" onclick="sendTopicToFriend()" style="width: 100%; margin-bottom: 8px;">送信する</button>
      <button class="action-btn" onclick="closeModal('sendModal')">キャンセル</button>
    </div>
  </div>
</div>

<!-- 評価返信モーダル -->
<div class="modal-overlay" id="evalModal">
  <div class="modal-content" style="text-align: left;">
    <div class="modal-title" style="text-align: center;" id="modalTopicTitle">お題の評価</div>
    <div id="modalMusicLinkContainer" style="text-align: center; margin-bottom: 12px;"></div>
    
    <div class="label-row" style="margin-bottom: 8px;">
      <label>評価</label>
      <div class="score-display-text" id="modalScoreValueDisplay">未選択</div>
    </div>
    <div class="star-scale-wrapper" style="margin-bottom:16px;">
      <div class="star-scale-row" id="modalStarScaleContainer"></div>
    </div>

    <div class="input-group">
      <label>メモ（感想など）</label>
      <textarea id="evalMemoInput" rows="2" placeholder="曲の感想を入力..." style="margin-top: 6px;"></textarea>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <button class="submit-btn" onclick="submitEvaluationResponse()" style="width: 100%; margin-bottom: 8px;">評価を確定して返信</button>
      <button class="action-btn" onclick="closeModal('evalModal')">キャンセル</button>
    </div>
  </div>
</div>

<script>
  let myId = '';
  let myName = '';
  let myCustomTitle = '';
  let selectedScore = 8;
  let modalScore = null;
  let currentInboxItem = null;
  let currentTimelineFilter = 'all';

  let currentInboxCount = 0;
  let currentReqCount = 0;

  const ADMIN_ID = 'UNIN Ⅳ';
  const SECRET_KEY = 'secretadmin';

  function isAdminUser() {
    return myId === ADMIN_ID;
  }

  function triggerAdminFireworks() {
    if (typeof confetti === 'function') {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    }
  }

  window.addEventListener('firebase-ready', () => {
    initMyProfile();
    renderMainScale();
    renderList();
    renderFriends();
    setupRealtimeListeners();
    if (isAdminUser()) {
      setupAdminAllUsersListener();
    }
  });

  function initMyProfile() {
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get('key');

    let storedId = localStorage.getItem('ten_my_id');

    if (keyParam === SECRET_KEY) {
      storedId = ADMIN_ID;
      localStorage.setItem('ten_my_id', ADMIN_ID);
    } else if (!storedId || storedId === ADMIN_ID) {
      const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
      storedId = 'TEN-' + randomStr;
      localStorage.setItem('ten_my_id', storedId);
    }

    myId = storedId;
    document.getElementById('displayMyId').innerText = myId;

    if (isAdminUser()) {
      document.getElementById('myIdBadgeElement').classList.add('admin');
      document.getElementById('adminAllUsersSection').style.display = 'block';
    } else {
      document.getElementById('myIdBadgeElement').classList.remove('admin');
      document.getElementById('adminAllUsersSection').style.display = 'none';
    }

    myName = localStorage.getItem('ten_my_name') || myId;
    document.getElementById('myNameInput').value = localStorage.getItem('ten_my_name') || '';

    syncProfileToFirebase();
  }

  function syncProfileToFirebase() {
    if (!myId) return;
    const userRef = window.dbRef(window.db, `users/${myId}`);
    window.dbSet(userRef, {
      id: myId,
      name: myName,
      customTitle: myCustomTitle || '',
      isAdmin: isAdminUser(),
      lastSeen: Date.now()
    });
  }

  function saveMyName() {
    const inputName = document.getElementById('myNameInput').value.trim();
    if (!inputName) return alert('名前を入力してください');
    
    myName = inputName;
    localStorage.setItem('ten_my_name', myName);
    syncProfileToFirebase();
    renderList();
    alert('表示名を保存しました！');
  }

  function copyMyId() {
    navigator.clipboard.writeText(myId).then(() => {
      alert(`あなたのID (${myId}) をコピーしました！`);
    });
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  function setTimelineFilter(filter, btnEl) {
    currentTimelineFilter = filter;
    document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
    btnEl.classList.add('active');
    renderList();
  }

  function renderMainScale() {
    renderStarScaleUI('starScaleContainer', 'scoreValueDisplay', selectedScore, (s) => {
      selectedScore = s;
      renderMainScale();
    }, false);
  }

  function renderModalScale() {
    renderStarScaleUI('modalStarScaleContainer', 'modalScoreValueDisplay', modalScore, (s) => {
      modalScore = s;
      renderModalScale();
    }, true);
  }

  function renderStarScaleUI(containerId, displayId, currentScore, onSelect, isModal = false) {
    const container = document.getElementById(containerId);
    const displayEl = document.getElementById(displayId);
    container.innerHTML = '';

    const minStars = isAdminUser() ? 0 : 1;
    const maxStars = isAdminUser() ? 25 : 11;

    if (currentScore === null) {
      displayEl.innerText = '未選択';
      displayEl.className = 'score-display-text';
    } else if (isAdminUser() && currentScore === 25) {
      displayEl.innerText = '25 / 10 (GOD)';
      displayEl.className = 'score-display-text god-max';
    } else if (isAdminUser() && currentScore === 0) {
      displayEl.innerText = '0 / 10 (虚無)';
      displayEl.className = 'score-display-text';
    } else if (isAdminUser() && currentScore >= 21) {
      displayEl.innerText = `${currentScore} / 10 (GOD)`;
      displayEl.className = 'score-display-text god-max';
    } else if (isAdminUser() && currentScore >= 12) {
      displayEl.innerText = `${currentScore} / 10 (MAX)`;
      displayEl.className = 'score-display-text admin-max';
    } else if (!isAdminUser() && currentScore === 11) {
      displayEl.innerText = '11 / 10';
      displayEl.className = 'score-display-text platinum';
    } else {
      displayEl.innerText = `${currentScore} / 10`;
      displayEl.className = 'score-display-text';
    }

    for (let i = minStars; i <= maxStars; i++) {
      if (isAdminUser() && (i === 11 || i === 21)) {
        const div = document.createElement('div');
        div.className = 'divider';
        container.appendChild(div);
      } else if (!isAdminUser() && i === 11) {
        const div = document.createElement('div');
        div.className = 'divider';
        container.appendChild(div);
      }

      const item = document.createElement('button');
      item.type = 'button';
      const isActive = currentScore !== null && (currentScore === 0 ? i === 0 : (i > 0 && i <= currentScore));
      
      let starClass = '';
      if (isAdminUser() && i >= 21) {
        starClass = 'god-star';
      } else if (isAdminUser() && i >= 12) {
        starClass = 'admin-star';
      } else if (i === 11) {
        starClass = 'platinum';
      }

      item.className = `star-item ${starClass} ${isActive ? 'active' : ''}`;
      
      item.innerHTML = `
        <span class="star-icon">${i === 0 ? '💀' : '★'}</span>
        <span class="star-num">${i}</span>
      `;

      item.onclick = () => {
        onSelect(i);
      };

      container.appendChild(item);
    }
  }

  function getMusicLinkHtml(url) {
    if (!url) return '';
    let label = '曲を聴く';
    let icon = '🎵';

    if (url.includes('spotify.com')) {
      label = 'Spotifyで聴く';
      icon = '🎧';
    } else if (url.includes('apple.com')) {
      label = 'Apple Musicで聴く';
      icon = '🍎';
    }

    return `<a href="${url}" target="_blank" rel="noopener noreferrer" class="music-link-btn">${icon} ${label}</a>`;
  }

  function getRatings() { return JSON.parse(localStorage.getItem('ten_ratings') || '[]'); }
  function saveRatings(data) { localStorage.setItem('ten_ratings', JSON.stringify(data)); }
  function getFriends() { return JSON.parse(localStorage.getItem('ten_friends') || '[]'); }
  function saveFriends(data) { localStorage.setItem('ten_friends', JSON.stringify(data)); }

  async function updateFriendsNamesInStorage() {
    const friends = getFriends();
    let updated = false;
    for (let i = 0; i < friends.length; i++) {
      const fId = typeof friends[i] === 'object' ? friends[i].id : friends[i];
      const userRef = window.dbRef(window.db, `users/${fId}`);
      try {
        const snapshot = await window.dbGet(userRef);
        if (snapshot.exists()) {
          const userData = snapshot.val();
          const fName = userData.name || fId;
          const customTitle = userData.customTitle || '';
          const isAdmin = userData.isAdmin || (fId === ADMIN_ID);
          
          const currentStored = friends[i];
          if (typeof currentStored !== 'object' || currentStored.name !== fName || currentStored.customTitle !== customTitle || currentStored.isAdmin !== isAdmin) {
            friends[i] = { id: fId, name: fName, customTitle: customTitle, isAdmin: isAdmin };
            updated = true;
          }
        }
      } catch (e) {}
    }
    if (updated) {
      saveFriends(friends);
      renderFriends();
    }
  }

  function getFriendInfo(fId) {
    const friends = getFriends();
    const found = friends.find(f => (typeof f === 'object' ? f.id : f) === fId);
    if (found && typeof found === 'object') {
      return { name: found.name || fId, customTitle: found.customTitle || '', isAdmin: found.isAdmin || (fId === ADMIN_ID) };
    }
    return { name: fId, customTitle: '', isAdmin: (fId === ADMIN_ID) };
  }

  // ---- フレンド申請機能 ----
  async function sendFriendRequestTo(targetId) {
    if (!targetId) return;
    if (targetId === myId) return alert('自分にフレンド申請は送れません');

    const friends = getFriends();
    const existing = friends.find(f => (typeof f === 'object' ? f.id : f) === targetId);
    if (existing) return alert('すでにフレンドに登録されています');

    const targetUserRef = window.dbRef(window.db, `users/${targetId}`);
    try {
      const snapshot = await window.dbGet(targetUserRef);
      if (!snapshot.exists()) return alert('該当するユーザーIDが存在しません');

      const reqRef = window.dbRef(window.db, `friend_requests/${targetId}/${myId}`);
      await window.dbSet(reqRef, {
        fromId: myId,
        fromName: myName,
        fromCustomTitle: myCustomTitle || '',
        fromIsAdmin: isAdminUser(),
        timestamp: Date.now()
      });

      alert(`ユーザー (${targetId}) にフレンド申請を送信しました！`);
    } catch (e) {
      alert('通信エラーが発生しました: ' + e.message);
    }
  }

  function sendFriendRequest() {
    const input = document.getElementById('friendIdInput');
    const fId = input.value.trim().toUpperCase();
    if (!fId) return;
    sendFriendRequestTo(fId).then(() => { input.value = ''; });
  }

  async function acceptFriendRequest(req) {
    const friends = getFriends();
    if (!friends.some(f => (typeof f === 'object' ? f.id : f) === req.fromId)) {
      friends.push({
        id: req.fromId,
        name: req.fromName || req.fromId,
        customTitle: req.fromCustomTitle || '',
        isAdmin: req.fromIsAdmin || (req.fromId === ADMIN_ID)
      });
      saveFriends(friends);
    }

    // 相手側のフレンドリストにも自分を追加（自動相互承認）
    const targetUserRef = window.dbRef(window.db, `users/${req.fromId}`);
    try {
      const reqRef = window.dbRef(window.db, `friend_requests/${myId}/${req.fromId}`);
      await window.dbRemove(reqRef);

      renderFriends();
      setupRealtimeListeners();
      alert(`${req.fromName || req.fromId} さんとフレンドになりました！`);
    } catch (e) {
      alert('処理中にエラーが発生しました');
    }
  }

  function rejectFriendRequest(fromId) {

  function setupRealtimeListeners() {
    if (!myId) return;

    updateFriendsNamesInStorage();

    const myTitleRef = window.dbRef(window.db, `users/${myId}/customTitle`);
    window.dbOnValue(myTitleRef, (snapshot) => {
      myCustomTitle = snapshot.val() || '';
    });

    // 届いているフレンド申請のリアルタイム監視
    const myReqRef = window.dbRef(window.db, `friend_requests/${myId}`);
    window.dbOnValue(myReqRef, (snapshot) => {
      const data = snapshot.val() || {};
      const reqList = Object.values(data);
      renderFriendRequests(reqList);
    });

    const myInboxRef = window.dbRef(window.db, `inbox/${myId}`);
    window.dbOnValue(myInboxRef, (snapshot) => {
      const data = snapshot.val() || {};
      const inboxList = Object.values(data);
      renderInbox(inboxList);
    });

    const ratings = getRatings();
    ratings.forEach(r => {
      if (r.status === 'waiting' && r.targetFriend) {
        const replyRef = window.dbRef(window.db, `replies/${myId}/${r.id}`);
        window.dbOnValue(replyRef, (snapshot) => {
          const reply = snapshot.val();
          if (reply) {
            if (reply.rejected) {
              r.status = 'rejected';
            } else {
              r.friendScore = reply.friendScore;
              r.memo = reply.memo || '';
              r.status = 'complete';
            }
            saveRatings(ratings);
            renderList();
            window.dbRemove(replyRef);
          }
        });
      }
    });
  }

    if (score >= 12) return `★ ${score}/10 (MAX)`;

  function renderList() {
    const listEl = document.getElementById('ratingList');
    let ratings = getRatings();

    if (currentTimelineFilter === 'complete') {
      ratings = ratings.filter(r => r.status === 'complete');
    } else if (currentTimelineFilter === 'waiting') {
      ratings = ratings.filter(r => r.status === 'waiting');
    } else if (currentTimelineFilter === 'rejected') {
      ratings = ratings.filter(r => r.status === 'rejected');
    }

    const searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
    if (searchQuery) {
      ratings = ratings.filter(r => (r.title || '').toLowerCase().includes(searchQuery));
    }

    const sortType = document.getElementById('sortSelect').value;
    ratings.sort((a, b) => {
      if (sortType === 'newest') {
        return (b.timestamp || 0) - (a.timestamp || 0);
      } else if (sortType === 'oldest') {
        return (a.timestamp || 0) - (b.timestamp || 0);
      } else if (sortType === 'highest') {
        const scoreA = Math.max(a.myScore || 0, a.friendScore || 0);
        const scoreB = Math.max(b.myScore || 0, b.friendScore || 0);
        return scoreB - scoreA;
      }
    });

    if (ratings.length === 0) {
      listEl.innerHTML = '<p style="text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px;">条件に一致する記録はありません</p>';
      return;
    }

    listEl.innerHTML = ratings.map(r => {
      const friendInfo = getFriendInfo(r.targetFriend);
      const targetNameDisplay = r.targetName || friendInfo.name || '相手';
      const targetTitleDisplay = friendInfo.customTitle ? `<span class="title-badge">🏷️ ${friendInfo.customTitle}</span>` : '';
      const targetIsAdmin = r.targetIsAdmin || friendInfo.isAdmin;

      let statusMeta = r.date;
      if (r.status === 'waiting') {
        statusMeta = `<span style="color:var(--text);">⏳ ${targetNameDisplay}の評価待ち...</span>`;
      } else if (r.status === 'rejected') {
        statusMeta = `<span style="color:#ff5555;">❌ ${targetNameDisplay}に拒否されました</span>`;
      }

      const titleHtml = r.title ? `<div class="card-title">${r.title}</div>` : '';
      const adminBadgeHtml = targetIsAdmin ? '<span class="admin-badge">👑 運営</span>' : '';

      const myScoreText = formatScoreText(r.myScore);
      const myScoreClass = getScoreClass(r.myScore);

      const friendScoreText = formatScoreText(r.friendScore);
      const friendScoreClass = getScoreClass(r.friendScore);

      const isGodCard = (r.myScore >= 21) || (r.friendScore >= 21);
      const isPlatinumCard = !isGodCard && ((r.myScore >= 11) || (r.friendScore >= 11));

      return `
        <div class="card ${targetIsAdmin ? 'is-admin-card' : ''} ${isGodCard ? 'is-god-card' : (isPlatinumCard ? 'is-platinum' : '')}">
          <div style="flex: 1; min-width: 0;">
            ${titleHtml}
            <div class="card-meta">${statusMeta}</div>
            ${getMusicLinkHtml(r.url)}
            ${r.memo ? `<div class="card-memo">“${r.memo}”</div>` : ''}
            <div><button class="action-btn" onclick="deleteRating('${r.id}')">削除</button></div>
          </div>
          <div class="card-scores">
            ${r.myScore !== null ? `
              <div class="card-score ${myScoreClass}">
                自分: ${myScoreText}
              </div>
            ` : ''}
            ${r.friendScore !== null ? `
              <div class="friend-score ${friendScoreClass}">
                ${targetNameDisplay}${targetTitleDisplay} ${adminBadgeHtml}:${friendScoreText}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
</script>
</body>
</html>
