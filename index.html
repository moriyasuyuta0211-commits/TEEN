<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEN — 2人専用リアルタイム評価共有</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #171717;
      --border: #262626;
      --text: #e5e5e5;
      --text-dim: #737373;
      --gold: #b6a078;
      --gold-glow: rgba(182, 160, 120, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .app-container { width: 100%; max-width: 480px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    
    .my-id-badge { background: #000; border: 1px solid var(--gold); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--gold); display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* タブ切り替え */
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-dim); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; position: relative; }
    .tab-btn.active { color: var(--text); }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: var(--gold); }
    .badge { background: var(--gold); color: #000; font-size: 10px; border-radius: 10px; padding: 2px 6px; margin-left: 4px; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* フォーム */
    .input-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .score-display-text { font-size: 14px; font-weight: 700; color: #fff; }
    .score-display-text.platinum { color: var(--gold); }

    input[type="text"], select { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 10px; font-size: 14px; }

    /* 星＋数字 UI */
    .star-scale-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 0; }
    .star-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; background: none; border: none; }
    .star-icon { font-size: 18px; color: #333; transition: color 0.15s; margin-bottom: 4px; }
    .star-item.active .star-icon { color: #fff; }
    .star-item.platinum .star-icon { color: #555; }
    .star-item.platinum.active .star-icon { color: var(--gold); text-shadow: 0 0 8px var(--gold-glow); }
    .star-num { font-size: 10px; font-weight: 700; color: #555; }
    .star-item.active .star-num { color: var(--text-dim); }
    .star-item.platinum.active .star-num { color: var(--gold); }
    
    .divider { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }

    .btn-group { display: flex; gap: 8px; margin-top: 16px; }
    .submit-btn { flex: 1; background: var(--text); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; }
    .share-btn { flex: 1; background: transparent; color: var(--gold); border: 1px solid var(--gold); font-weight: 600; border-radius: 6px; padding: 12px; font-size: 13px; cursor: pointer; }

    /* リスト */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card.is-platinum { border-color: rgba(182, 160, 120, 0.4); }
    .card-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .card-meta { font-size: 11px; color: var(--text-dim); }
    .card-scores { text-align: right; }
    .card-score { font-size: 13px; font-weight: 700; color: var(--text); }
    .card-score.platinum { color: var(--gold); }
    .friend-score { font-size: 12px; color: var(--gold); margin-top: 2px; font-weight: 600; }
    
    .action-btn { background: none; border: none; color: var(--text-dim); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }

    /* モーダル */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; text-align: center; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhc55wV9tg83dAtYL-PkHlaeo3hn9USg8",
      authDomain: "tenn-36f7d.firebaseapp.com",
      projectId: "tenn-36f7d",
      storageBucket: "tenn-36f7d.firebasestorage.app",
      messagingSenderId: "125540409265",
      appId: "1:125540409265:web:e8bfcb2990f6e3814aa790",
      measurementId: "G-S89F1QBE8Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbGet = get;
    window.dbPush = push;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
    
    window.dispatchEvent(new Event('firebase-ready'));
  </script>
</head>
<body>

<div class="app-container">
  <header>
    <h1>TEN</h1>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button onclick="clearAllData()" style="background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; padding: 4px 8px; font-size: 11px; cursor: pointer;">データ消去 🗑️</button>
      <div class="my-id-badge" onclick="copyMyId()">
        <span>ID: <strong id="displayMyId">接続中...</strong></span>
        <span style="font-size: 10px; opacity: 0.7;">📋</span>
      </div>
    </div>
  </header>

  <!-- タブナビゲーション -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('timeline')">タイムライン</button>
    <button class="tab-btn" onclick="switchTab('inbox')">受信トレイ <span class="badge" id="inboxCount" style="display:none;">0</span></button>
    <button class="tab-btn" onclick="switchTab('friends')">設定・フレンド</button>
  </div>

  <!-- 1. タイムライン -->
  <div id="tab-timeline" class="tab-content active">
    <div class="input-card">
      <div class="input-group">
        <label>評価対象</label>
        <input type="text" id="itemTitle" placeholder="例：ある曲、映画など" style="margin-top: 6px;">
      </div>
      <div class="input-group">
        <div class="label-row">
          <label>評価</label>
          <div class="score-display-text" id="scoreValueDisplay">8 / 10</div>
        </div>
        <div class="star-scale-row" id="starScaleContainer"></div>
      </div>
      <div class="btn-group">
        <button class="submit-btn" onclick="addMyRating()">自分だけで記録</button>
        <button class="share-btn" onclick="openSendTopicModal()">フレンドにお題を送信</button>
      </div>
    </div>
    <div id="ratingList"></div>
  </div>

  <!-- 2. 受信トレイ -->
  <div id="tab-inbox" class="tab-content">
    <div id="inboxList">
      <p style="text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px;">届いたお題はありません</p>
    </div>
  </div>

  <!-- 3. 設定・フレンド -->
  <div id="tab-friends" class="tab-content">
    <!-- 自分のプロフィール設定 -->
    <div class="input-card">
      <div class="input-group">
        <label>自分の表示名</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="myNameInput" placeholder="例: たろう">
          <button class="submit-btn" style="width: auto; padding: 0 16px;" onclick="saveMyName()">保存</button>
        </div>
      </div>
    </div>

    <!-- フレンド登録 -->
    <div class="input-card">
      <div class="input-group">
        <label>友達のIDを登録</label>
        <div style="display:flex; gap:8px; margin-top: 6px;">
          <input type="text" id="friendIdInput" placeholder="例: TEN-A8F2">
          <button class="submit-btn" style="width: auto; padding: 0 16px;" onclick="addFriend()">登録</button>
        </div>
      </div>
    </div>
    <div id="friendsList"></div>
  </div>
</div>

<!-- お題送信モーダル -->
<div class="modal-overlay" id="sendModal">
  <div class="modal-content">
    <div class="modal-title">お題を送信</div>
    <p style="font-size:12px; color:var(--text-dim); margin-bottom:16px;" id="sendModalTopicName"></p>
    <div class="input-group" style="text-align:left;">
      <label>送信先フレンド</label>
      <select id="friendSelect" style="margin-top: 6px;"></select>
    </div>
    <button class="submit-btn" onclick="sendTopicToFriend()" style="margin-bottom:8px;">送信する</button>
    <br>
    <button class="action-btn" onclick="closeModal('sendModal')">キャンセル</button>
  </div>
</div>

<!-- 評価返信モーダル -->
<div class="modal-overlay" id="evalModal">
  <div class="modal-content">
    <div class="modal-title" id="modalTopicTitle">お題の評価</div>
    <p style="font-size:12px; color:var(--text-dim); margin-bottom:12px;">評価を選んで返信してください</p>
    <div class="label-row" style="margin-bottom: 8px;">
      <label>評価</label>
      <div class="score-display-text" id="modalScoreValueDisplay">8 / 10</div>
    </div>
    <div class="star-scale-row" id="modalStarScaleContainer" style="margin-bottom:20px;"></div>
    <button class="submit-btn" onclick="submitEvaluationResponse()">評価を確定して返信</button>
    <br>
    <button class="action-btn" onclick="closeModal('evalModal')" style="margin-top: 10px;">キャンセル</button>
  </div>
</div>

<script>
  let myId = '';
  let myName = '';
  let selectedScore = 8;
  let modalScore = 8;
  let currentInboxItem = null;

  window.addEventListener('firebase-ready', () => {
    initMyProfile();
    renderMainScale();
    renderList();
    renderFriends();
    setupRealtimeListeners();
  });

  function initMyProfile() {
    let storedId = localStorage.getItem('ten_my_id');
    if (!storedId) {
      const randomStr = Math.random().toString(36).substring(2, 6).toUpperCase();
      storedId = 'TEN-' + randomStr;
      localStorage.setItem('ten_my_id', storedId);
    }
    myId = storedId;
    document.getElementById('displayMyId').innerText = myId;

    myName = localStorage.getItem('ten_my_name') || myId;
    document.getElementById('myNameInput').value = localStorage.getItem('ten_my_name') || '';

    syncProfileToFirebase();
  }

  function syncProfileToFirebase() {
    if (!myId) return;
    const userRef = window.dbRef(window.db, `users/${myId}`);
    window.dbSet(userRef, {
      id: myId,
      name: myName,
      lastSeen: Date.now()
    });
  }

  function saveMyName() {
    const inputName = document.getElementById('myNameInput').value.trim();
    if (!inputName) return alert('名前を入力してください');
    myName = inputName;
    localStorage.setItem('ten_my_name', myName);
    syncProfileToFirebase();
    alert('表示名を保存しました！');
  }

  function copyMyId() {
    navigator.clipboard.writeText(myId).then(() => {
      alert(`あなたのID (${myId}) をコピーしました！`);
    });
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  // メイン画面の評価スケール描画
  function renderMainScale() {
    renderStarScaleUI('starScaleContainer', 'scoreValueDisplay', selectedScore, (s) => {
      selectedScore = s;
      renderMainScale();
    });
  }

  // モーダル画面の評価スケール描画
  function renderModalScale() {
    renderStarScaleUI('modalStarScaleContainer', 'modalScoreValueDisplay', modalScore, (s) => {
      modalScore = s;
      renderModalScale();
    });
  }

  // 共通の星＋数字UIジェネレーター
  function renderStarScaleUI(containerId, displayId, currentScore, onSelect) {
    const container = document.getElementById(containerId);
    const displayEl = document.getElementById(displayId);
    container.innerHTML = '';

    if (currentScore === 11) {
      displayEl.innerText = '11 / 10';
      displayEl.className = 'score-display-text platinum';
    } else {
      displayEl.innerText = `${currentScore} / 10`;
      displayEl.className = 'score-display-text';
    }

    for (let i = 1; i <= 11; i++) {
      if (i === 11) {
        const div = document.createElement('div');
        div.className = 'divider';
        container.appendChild(div);
      }

      const item = document.createElement('button');
      item.type = 'button';
      item.className = `star-item ${i === 11 ? 'platinum' : ''} ${i <= currentScore ? 'active' : ''}`;
      
      item.innerHTML = `
        <span class="star-icon">★</span>
        <span class="star-num">${i}</span>
      `;

      item.onclick = () => {
        onSelect(i);
      };

      container.appendChild(item);
    }
  }

  function getRatings() { return JSON.parse(localStorage.getItem('ten_ratings') || '[]'); }
  function saveRatings(data) { localStorage.setItem('ten_ratings', JSON.stringify(data)); }
  function getFriends() { return JSON.parse(localStorage.getItem('ten_friends') || '[]'); }
  function saveFriends(data) { localStorage.setItem('ten_friends', JSON.stringify(data)); }

  function addMyRating() {
    const title = document.getElementById('itemTitle').value.trim();
    if (!title) return alert('対象名を入力してください');

    const ratings = getRatings();
    ratings.unshift({
      id: 'local_' + Date.now(),
      title: title,
      myScore: selectedScore,
      friendScore: null,
      status: 'complete',
      date: new Date().toISOString().split('T')[0]
    });

    saveRatings(ratings);
    document.getElementById('itemTitle').value = '';
    renderList();
  }

  async function addFriend() {
    const input = document.getElementById('friendIdInput');
    const fId = input.value.trim().toUpperCase();
    if (!fId) return;
    if (fId === myId) return alert('自分のIDは登録できません');

    const userRef = window.dbRef(window.db, `users/${fId}`);
    try {
      const snapshot = await window.dbGet(userRef);
      if (!snapshot.exists()) {
        alert('このIDは無効です。');
        return;
      }

      const userData = snapshot.val();
      const friendName = userData.name || fId;

      const friends = getFriends();
      const existing = friends.find(f => (typeof f === 'object' ? f.id : f) === fId);
      
      if (!existing) {
        friends.push({ id: fId, name: friendName });
        saveFriends(friends);
        input.value = '';
        renderFriends();
        alert(`フレンド (${friendName}) を登録しました！`);
        setupRealtimeListeners();
      } else {
        alert('すでに登録されているフレンドです');
      }
    } catch (e) {
      alert('通信エラーが発生しました。もう一度試してください。');
    }
  }

  function renderFriends() {
    const friends = getFriends();
    const listEl = document.getElementById('friendsList');
    if (friends.length === 0) {
      listEl.innerHTML = '<p style="text-align: center; color: var(--text-dim); font-size: 12px;">登録されたフレンドはいません</p>';
      return;
    }
    listEl.innerHTML = friends.map(f => {
      const fId = typeof f === 'object' ? f.id : f;
      const fName = typeof f === 'object' ? f.name : f;
      return `
        <div class="card">
          <div>
            <strong style="color:var(--gold);">${fName}</strong>
            <div style="font-size:10px; color:var(--text-dim);">${fId}</div>
          </div>
          <button class="action-btn" onclick="removeFriend('${fId}')">削除</button>
        </div>
      `;
    }).join('');
  }

  function removeFriend(fId) {
    const friends = getFriends().filter(f => (typeof f === 'object' ? f.id : f) !== fId);
    saveFriends(friends);
    renderFriends();
    setupRealtimeListeners();
  }

  function openSendTopicModal() {
    const title = document.getElementById('itemTitle').value.trim();
    if (!title) return alert('対象名を入力してください');

    document.getElementById('sendModalTopicName').innerText = `「${title}」を送信`;
    const friends = getFriends();
    const select = document.getElementById('friendSelect');
    
    if (friends.length === 0) {
      select.innerHTML = '<option value="">登録フレンドがいません</option>';
    } else {
      select.innerHTML = friends.map(f => {
        const fId = typeof f === 'object' ? f.id : f;
        const fName = typeof f === 'object' ? f.name : f;
        return `<option value="${fId}">${fName} (${fId})</option>`;
      }).join('');
    }
    document.getElementById('sendModal').style.display = 'flex';
  }

  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  function sendTopicToFriend() {
    const title = document.getElementById('itemTitle').value.trim();
    const friendId = document.getElementById('friendSelect').value;
    if (!friendId) return alert('フレンドを選択してください');

    const topicId = 'topic_' + Date.now();
    
    const ratings = getRatings();
    ratings.unshift({
      id: topicId,
      title: title,
      myScore: selectedScore,
      friendScore: null,
      status: 'waiting',
      targetFriend: friendId,
      date: new Date().toISOString().split('T')[0]
    });
    saveRatings(ratings);

    const inboxRef = window.dbRef(window.db, `inbox/${friendId}/${topicId}`);
    window.dbSet(inboxRef, {
      topicId: topicId,
      title: title,
      fromId: myId,
      fromName: myName,
      fromScore: selectedScore
    }).then(() => {
      closeModal('sendModal');
      document.getElementById('itemTitle').value = '';
      renderList();
      alert(`お題を送信しました！`);
    });
  }

  function setupRealtimeListeners() {
    if (!myId) return;

    const myInboxRef = window.dbRef(window.db, `inbox/${myId}`);
    window.dbOnValue(myInboxRef, (snapshot) => {
      const data = snapshot.val() || {};
      const inboxList = Object.values(data);
      renderInbox(inboxList);
    });

    const ratings = getRatings();
    ratings.forEach(r => {
      if (r.status === 'waiting' && r.targetFriend) {
        const replyRef = window.dbRef(window.db, `replies/${myId}/${r.id}`);
        window.dbOnValue(replyRef, (snapshot) => {
          const reply = snapshot.val();
          if (reply) {
            r.friendScore = reply.friendScore;
            r.status = 'complete';
            saveRatings(ratings);
            renderList();
            window.dbRemove(replyRef);
          }
        });
      }
    });
  }

  function renderInbox(inboxList = []) {
    const countEl = document.getElementById('inboxCount');
    const listEl = document.getElementById('inboxList');

    if (inboxList.length > 0) {
      countEl.innerText = inboxList.length;
      countEl.style.display = 'inline-block';
      listEl.innerHTML = inboxList.map((item) => `
        <div class="card">
          <div>
            <div class="card-title">${item.title}</div>
            <div class="card-meta">差出人: ${item.fromName || item.fromId}</div>
          </div>
          <button class="submit-btn" style="width:auto; padding:8px 12px;" onclick='openEvalModal(${JSON.stringify(item)})'>評価する</button>
        </div>
      `).join('');
    } else {
      countEl.style.display = 'none';
      listEl.innerHTML = '<p style="text-align: center; color: var(--text-dim); font-size: 13px; padding: 20px;">届いたお題はありません</p>';
    }
  }

  function openEvalModal(item) {
    currentInboxItem = item;
    document.getElementById('modalTopicTitle').innerText = `お題: ${item.title}`;
    modalScore = 8;
    renderModalScale();
    document.getElementById('evalModal').style.display = 'flex';
  }

  function submitEvaluationResponse() {
    if (!currentInboxItem) return;

    const ratings = getRatings();
    ratings.unshift({
      id: 'local_' + Date.now(),
      title: currentInboxItem.title,
      myScore: modalScore,
      friendScore: currentInboxItem.fromScore,
      status: 'complete',
      date: new Date().toISOString().split('T')[0]
    });
    saveRatings(ratings);

    const replyRef = window.dbRef(window.db, `replies/${currentInboxItem.fromId}/${currentInboxItem.topicId}`);
    window.dbSet(replyRef, { friendScore: modalScore }).then(() => {
      const inboxRef = window.dbRef(window.db, `inbox/${myId}/${currentInboxItem.topicId}`);
      window.dbRemove(inboxRef);

      closeModal('evalModal');
      renderList();
      alert('評価を返信しました！');
    }).catch((error) => {
      alert('返信の送信に失敗しました: ' + error.message);
    });
  }

  function deleteRating(id) {
    saveRatings(getRatings().filter(r => r.id !== id));
    renderList();
  }

  function clearAllData() {
    if (confirm('これまで記録したローカルデータをすべて消去しますか？')) {
      localStorage.removeItem('ten_ratings');
      location.reload();
    }
  }

  function renderList() {
    const listEl = document.getElementById('ratingList');
    const ratings = getRatings();

    listEl.innerHTML = ratings.map(r => `
      <div class="card ${r.myScore === 11 || r.friendScore === 11 ? 'is-platinum' : ''}">
        <div>
          <div class="card-title">${r.title}</div>
          <div class="card-meta">
            ${r.status === 'waiting' ? `<span style="color:var(--gold);">⏳ 評価待ち...</span>` : r.date}
          </div>
          <button class="action-btn" onclick="deleteRating('${r.id}')">削除</button>
        </div>
        <div class="card-scores">
          ${r.myScore !== null ? `
            <div class="card-score ${r.myScore === 11 ? 'platinum' : ''}">
              自分: ${r.myScore === 11 ? '★ 11/10' : `${r.myScore} / 10`}
            </div>
          ` : ''}
          ${r.friendScore !== null ? `
            <div class="friend-score">
              相手: ${r.friendScore === 11 ? '★ 11/10' : `${r.friendScore} / 10`}
            </div>
          ` : ''}
        </div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
